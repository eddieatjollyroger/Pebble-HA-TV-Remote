<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="utf-8">
    <title>Pebble HA Remote Setup</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        /* Same terminal style in two palettes, switched by data-theme on <html>.
           dark = green on black, light = black on white. */
        :root, :root[data-theme="dark"] {
            --bg: #000000;
            --fg: #00ff55;
            --dim: #00a83a;
            --line: #00a83a;
            --btn-bg: #00ff55;
            --btn-fg: #000000;
            --btn-hover-bg: #000000;
            --btn-hover-fg: #00ff55;
        }
        :root[data-theme="light"] {
            --bg: #ffffff;
            --fg: #000000;
            --dim: #555555;
            --line: #555555;
            --btn-bg: #000000;
            --btn-fg: #ffffff;
            --btn-hover-bg: #ffffff;
            --btn-hover-fg: #000000;
        }

        * { box-sizing: border-box; }
        body {
            margin: 0;
            padding: 20px;
            background: var(--bg);
            color: var(--fg);
            font-family: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, "Liberation Mono", "Courier New", monospace;
            font-size: 15px;
            line-height: 1.4;
        }
        .wrap { max-width: 480px; margin: 0 auto; }

        .topbar { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 16px; }
        h1 { font-size: 18px; margin: 0; font-weight: 700; }
        .cursor { animation: blink 1s steps(1) infinite; }
        @keyframes blink { 50% { opacity: 0; } }
        @media (prefers-reduced-motion: reduce) { .cursor { animation: none; } }

        .divider { border: 0; border-top: 1px dashed var(--line); margin: 0 0 16px; }

        .card { padding: 20px; border: 1px dashed var(--line); }

        .item { margin-bottom: 18px; }
        label { display: block; font-weight: 600; margin-bottom: 6px; font-size: 14px; color: var(--dim); }
        label .prompt { color: var(--fg); }

        input {
            width: 100%;
            padding: 12px;
            background: var(--bg);
            color: var(--fg);
            border: 1px solid var(--line);
            border-radius: 0;
            font-family: inherit;
            font-size: 16px;            /* 16px stops iOS from zooming on focus */
            caret-color: var(--fg);
        }
        input::placeholder { color: var(--dim); opacity: 0.7; }
        input:focus, button:focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; }

        button { font-family: inherit; cursor: pointer; border-radius: 0; }
        #save_btn {
            width: 100%;
            padding: 14px;
            background: var(--btn-bg);
            color: var(--btn-fg);
            border: 1px solid var(--btn-bg);
            font-weight: 700;
            font-size: 16px;
            transition: background 0.2s, color 0.2s;
        }
        #save_btn:hover { background: var(--btn-hover-bg); color: var(--btn-hover-fg); }

        #theme_btn {
            background: transparent;
            color: var(--dim);
            border: 1px solid var(--line);
            padding: 6px 10px;
            font-size: 13px;
            white-space: nowrap;
        }
        #theme_btn:hover { color: var(--fg); border-color: var(--fg); }

        .hint { color: var(--dim); font-size: 13px; margin: 14px 0 0; }
    </style>
</head>
<body>
    <div class="wrap">
        <div class="topbar">
            <h1># TV Remote Setup<span class="cursor">_</span></h1>
            <button id="theme_btn" type="button" aria-pressed="false">theme: dark</button>
        </div>
        <hr class="divider">

        <div class="card">
            <div class="item">
                <label for="ha_url"><span class="prompt">$ </span>Home Assistant URL</label>
                <input id="ha_url" type="url" inputmode="url" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="https://your-ha.duckdns.org:8123">
            </div>
            <div class="item">
                <label for="ha_token"><span class="prompt">$ </span>Long-Lived Access Token</label>
                <input id="ha_token" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Paste long token here...">
            </div>
            <button id="save_btn" type="button">Save Configuration</button>
            <p class="hint">The theme applies to the watch app too, once you save. Create a token in Home Assistant under your profile, Security tab, Long-lived access tokens.</p>
        </div>
    </div>

    <script>
    function getQueryParam(variable) {
        var query = window.location.search.substring(1);
        var vars = query.split('&');
        for (var i = 0; i < vars.length; i++) {
            var pair = vars[i].split('=');
            if (pair[0] === variable && pair[1] !== undefined) {
                return decodeURIComponent(pair[1]);
            }
        }
        return '';
    }

    var root = document.documentElement;
    var themeBtn = document.getElementById('theme_btn');

    function applyTheme(theme) {
        root.setAttribute('data-theme', theme);
        themeBtn.textContent = 'theme: ' + theme;
        themeBtn.setAttribute('aria-pressed', theme === 'light' ? 'true' : 'false');
    }

    // Start from the theme the watch app is using (passed in the link), else the last
    // one picked on this device, else dark.
    var startTheme = 'dark';
    var fromLink = getQueryParam('theme');
    if (fromLink === 'light' || fromLink === 'dark') {
        startTheme = fromLink;
    } else {
        try {
            var stored = localStorage.getItem('pebble_ha_theme');
            if (stored === 'light' || stored === 'dark') startTheme = stored;
        } catch (e) { /* storage unavailable: use the default */ }
    }
    applyTheme(startTheme);

    themeBtn.addEventListener('click', function() {
        var next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
        applyTheme(next);
        try { localStorage.setItem('pebble_ha_theme', next); } catch (e) { }
    });

    // Fill the fields with the values already saved on the phone
    document.getElementById('ha_url').value = getQueryParam('url');
    document.getElementById('ha_token').value = getQueryParam('token');

    document.getElementById('save_btn').addEventListener('click', function() {
        var config = {
            ha_url: document.getElementById('ha_url').value.trim(),
            ha_token: document.getElementById('ha_token').value.trim(),
            theme: root.getAttribute('data-theme')
        };

        var return_to = getQueryParam('return_to') || 'pebblejs://close#';
        document.location = return_to + encodeURIComponent(JSON.stringify(config));
    });
    </script>
</body>
</html>
