<!DOCTYPE html>
<html>
<head>
    <title>Pebble HA Remote Setup</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 20px; background: #f4f4f9; color: #333; }
        h2 { text-align: center; color: #222; }
        .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); margin-bottom: 20px; }
        .item { margin-bottom: 15px; }
        label { display: block; font-weight: 600; margin-bottom: 6px; font-size: 14px; }
        input { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-size: 14px; }
        button { width: 100%; padding: 14px; background: #007aff; color: white; border: none; border-radius: 6px; font-weight: bold; font-size: 16px; cursor: pointer; transition: background 0.2s; }
        button:hover { background: #0056b3; }
    </style>
</head>
<body>
    <h2>TV Remote Setup</h2>
    <div class="card">
        <div class="item">
            <label>Home Assistant URL</label>
            <input id="ha_url" type="url" placeholder="https://duckdns.org">
        </div>
        <div class="item">
            <label>Long-Lived Access Token</label>
            <input id="ha_token" type="text" placeholder="Paste long token here...">
        </div>
        <button id="save_btn">Save Configuration</button>
    </div>

        <script>
    function getQueryParam(variable) {
        var query = window.location.search.substring(1);
        var vars = query.split('&');
        for (var i = 0; i < vars.length; i++) {
            var pair = vars[i].split('=');
            // FIXED: properly validate the key name and pull index value array [1]
            if (pair[0] === variable) { 
                return decodeURIComponent(pair[1]); 
            }
        }
        return '';
    }

    // Now correctly reads existing fields on page initialize mount
    document.getElementById('ha_url').value = getQueryParam('url');
    document.getElementById('ha_token').value = getQueryParam('token');

    document.getElementById('save_btn').addEventListener('click', function() {
        var config = {
            ha_url: document.getElementById('ha_url').value.trim(),
            ha_token: document.getElementById('ha_token').value.trim()
        };

        var return_to = getQueryParam('return_to') || 'pebblejs://close#';
        document.location = return_to + encodeURIComponent(JSON.stringify(config));
    });
</script>

</body>
</html>
